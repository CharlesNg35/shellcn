# Copy to config.yaml and adjust for your environment.

# HTTP listener and process logging.
server:
  addr: ":8081"
  log_level: info
  # log_file: /var/log/shellcn.log  # default: stdout; rotated by size automatically
  access_log: false

# Encryption keys for stored credentials and other secrets.
secrets:
  master_key: ""
  master_key_file: ""

# Browser session lifetime and JWT signing.
auth:
  session_ttl: 24h
  # If empty, derives the signing key from the master key
  jwt_secret: ""

# First admin account created when the database is empty.
bootstrap:
  # Leave admin_password empty to print a
  # generated one-time initial password on first startup.
  admin_username: admin
  admin_password: ""

# Gateway metadata store.
database:
  driver: sqlite
  dsn: shellcn.db
  # driver: postgres
  # dsn: host=localhost user=shellcn password=secret dbname=shellcn port=5432 sslmode=disable
  # driver: mysql
  # dsn: shellcn:secret@tcp(localhost:3306)/shellcn?charset=utf8mb4&parseTime=True&loc=Local

# Outbound SMTP for invitations and account email.
email:
  enabled: false
  host: smtp.example.com
  port: 587
  from: "ShellCN <shellcn@example.com>"
  username: shellcn@example.com
  password: ""
  use_tls: false

# Audit event storage and optional retention cleanup.
audit:
  enabled: true
  retention_days: 0
  cleanup_interval: 1h

# Coordinates active sessions and agent tunnels across gateway instances.
# Tune these only if sessions or agents expire too aggressively.
live_state:
  lease_ttl: 15s
  renew_interval: 5s

# Shared AI provider configured by the operator for everyone.
# Settings -> AI providers manages encrypted per-user provider keys and models.
# Supported kinds: openrouter, openai, anthropic, google, openai_compatible.
# ai:
#   kind: openrouter
#   name: Shared OpenRouter
#   api_key: sk-or-v1-example
#   model: openai/gpt-4o
#   base_url: ""

# OpenAI-compatible example.
# ai:
#   kind: openai_compatible
#   name: Shared Local AI
#   base_url: http://127.0.0.1:11434/v1
#   api_key: ollama
#   model: llama3.1:8b

# Session recording storage and optional retention cleanup.
recordings:
  dir: recordings
  retention_days: 0
  cleanup_interval: 1h
  max_chunk_bytes: 8388608

# Out-of-tree plugin directory and marketplace indexes.
# plugins:
#   dir: plugins.d # directory scanned for external plugin binaries ("" disables)
#   market:
#     enabled: true # allow installing plugins from the registry indexes
#     indexes:
#       - https://raw.githubusercontent.com/CharlesNg35/shellcn-plugin-registry/main/index.json

# Checks GitHub for a newer release
